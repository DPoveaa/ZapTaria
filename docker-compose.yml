services:
  postgres:
    image: postgres:15-alpine
    container_name: zaptaria_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zaptaria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: zaptaria_app
    restart: always
    ports:
      - "3000:3000"
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/zaptaria?schema=public
      APP_URL: http://localhost:3000
      API_URL: http://localhost:5000
      PORT: 5000
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      KEY_FINGERPRINT_SECRET: ${KEY_FINGERPRINT_SECRET}
      GEMINI_DEFAULT_MODEL: gemini-2.5-flash
    depends_on:
      - postgres

volumes:
  pgdata:
